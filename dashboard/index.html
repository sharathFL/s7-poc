<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S7 PoC Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mut:#6b7686;--bd:#dfe3ea;--ok:#1a7f4b;--warn:#b7791f;--bad:#c0392b;--acc:#2456c9}
@media (prefers-color-scheme:dark){:root{--bg:#10141b;--card:#181e28;--fg:#e6eaf0;--mut:#8b96a8;--bd:#2a3342;--ok:#4cc38a;--warn:#e0b04a;--bad:#ef6f61;--acc:#6b95ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:16px;margin:0}main{padding:16px;max-width:1200px;margin:auto;display:grid;gap:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px 14px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 8px}
.big{font-size:20px;font-weight:600}.mut{color:var(--mut)}.small{font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--mut)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}.wrap{overflow-x:auto}td.num{font-variant-numeric:tabular-nums}
.pill{padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid currentColor}
select{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:4px 8px}
ul{margin:0;padding-left:18px}li{margin:2px 0}
</style></head><body>
<header><h1>S7 PoC &middot; S7comm vs OPC UA <span id="impl" class="mut small"></span></h1>
<div><label class="small mut">Device <select id="dev"></select></label> <span id="upd" class="small mut"></span></div></header>
<main>
 <div class="grid" id="status"></div>
 <section class="card"><h2>Tags &mdash; side-by-side</h2><div class="wrap"><table>
  <thead><tr><th>Tag</th><th>Type</th><th>S7comm</th><th>Q</th><th>OPC UA</th><th>Q</th><th>&Delta;</th><th>Skew</th><th>Result</th><th>S7 sampled</th><th>OPC UA sampled</th></tr></thead>
  <tbody id="tags"></tbody></table></div>
  <p class="small mut" id="note"></p></section>
 <div class="grid">
  <section class="card"><h2>Protocol performance</h2><div class="wrap"><table id="perf"></table></div></section>
  <section class="card"><h2>Communication errors</h2><ul id="errs" class="small"></ul></section>
 </div>
</main>
<script>
const $=s=>document.getElementById(s);const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const qc=q=>q==="GOOD"?"ok":q==="STALE"?"warn":"bad";
const fmt=v=>v===null||v===undefined?"&ndash;":typeof v==="number"?(Number.isInteger(v)?v:v.toFixed(3)):esc(v);
const t=ts=>ts?ts.slice(11,23):"";
let dev=null;
async function j(u){const r=await fetch(u);if(!r.ok)throw new Error(u+" "+r.status);return r.json()}
async function init(){
  const h=await j("health");$("impl").textContent="("+h.implementation+")";
  const ds=await j("devices");$("dev").innerHTML=ds.map(d=>`<option value="${esc(d.id)}">${esc(d.id)}${d.mock?" (mock)":""}</option>`).join("");
  dev=ds[0]?.id;$("dev").onchange=e=>{dev=e.target.value;tick()};tick();setInterval(tick,1000)}
function chanCard(name,c){
  if(!c)return `<div class="card"><h2>${name}</h2><span class="mut">disabled</span></div>`;
  const cls=c.connected?"ok":"bad";
  return `<div class="card"><h2>${name}${c.mock?" (simulated)":""}</h2><div class="big"><span class="dot ${cls}"></span>${c.connected?"Connected":"Disconnected"}</div>
  <div class="small mut">last ok: ${t(c.last_success)||"never"} &middot; reconnects: ${c.reconnects}</div>
  ${c.last_error?`<div class="small bad">${esc(c.last_error)}</div>`:""}</div>`}
async function tick(){
  if(!dev)return;
  try{
    const [st,cmp]=await Promise.all([j(`devices/${dev}/status`),j(`comparison?device_id=${dev}`)]);
    const cls={ONLINE:"ok",DEGRADED:"warn",OFFLINE:"bad"}[st.state];
    $("status").innerHTML=`<div class="card"><h2>PLC ${esc(st.ip)}</h2><div class="big ${cls}"><span class="dot ${cls}"></span>${st.state}</div><div class="small mut">${cmp.summary.matching}/${cmp.summary.compared} tags match across protocols</div></div>`+
      chanCard("S7comm",st.channels.s7comm)+chanCard("OPC UA",st.channels.opcua);
    $("tags").innerHTML=cmp.tags.map(r=>{const a=r.s7comm,b=r.opcua;
      const cell=(x)=>x?`<td class="num">${fmt(x.value)}</td><td class="${qc(x.quality)}">${x.quality}</td>`:`<td>&ndash;</td><td>&ndash;</td>`;
      const rc={MATCH:"ok",DIFFERENT:"warn",UNUSABLE:"bad",INCOMPLETE:"mut"}[r.status];
      return `<tr><td><b>${esc(r.tag)}</b></td><td class="mut">${esc(a?.datatype||"")} / ${esc(b?.datatype||"")}${r.type_match===false?' <span class="warn">?</span>':""}</td>${cell(a)}${cell(b)}
      <td class="num">${r.value_diff==null?"&ndash;":r.value_diff.toFixed(3)}</td><td class="num">${r.skew_ms==null?"&ndash;":r.skew_ms+" ms"}</td>
      <td><span class="pill ${rc}">${r.status}</span></td><td class="mut">${t(a?.timestamp)}</td><td class="mut">${t(b?.timestamp)}</td></tr>`}).join("");
    $("note").textContent=cmp.note+` Tolerance: rel ${cmp.tolerance.relative}, abs ${cmp.tolerance.absolute}.`;
    const ps=cmp.protocol_stats;
    $("perf").innerHTML="<tr><th>Protocol</th><th>Success</th><th>Avg ms</th><th>P95 ms</th><th>Max ms</th><th>OK/Fail</th></tr>"+
      Object.entries(ps).map(([k,v])=>`<tr><td>${k}</td><td>${v.success_rate==null?"&ndash;":(v.success_rate*100).toFixed(1)+"%"}</td><td class="num">${fmt(v.latency_ms.avg)}</td><td class="num">${fmt(v.latency_ms.p95)}</td><td class="num">${fmt(v.latency_ms.max)}</td><td>${v.reads_ok}/${v.reads_fail}</td></tr>`).join("");
    const errs=Object.values(st.channels).flatMap(c=>c.recent_errors).sort((a,b)=>b.time.localeCompare(a.time)).slice(0,10);
    $("errs").innerHTML=errs.length?errs.map(e=>`<li><span class="mut">${t(e.time)}</span> <b>${esc(e.protocol)}</b> ${esc(e.message)}</li>`).join(""):'<li class="mut">none</li>';
    $("upd").textContent="updated "+new Date().toLocaleTimeString();
  }catch(e){$("upd").innerHTML=`<span class="bad">API unreachable: ${esc(e.message)}</span>`}
}
init();
</script></body></html>
